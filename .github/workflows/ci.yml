name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      - run: cargo build --workspace --release
      - name: Self-test (fault injection must be detected)
        run: target/release/memforge.exe self-test
      - uses: actions/upload-artifact@v4
        with:
          name: memforge-windows-x64
          path: |
            target/release/memforge.exe
            target/release/memforge-gui.exe

  linux-portable:
    # Core + engine are portable; keeps the non-Windows fallback compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memforge-core -p memforge-platform -p memforge-engine -p memforge-cli
